<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- PaperKiosk: Nunito installed as a system font ("Kiosk Nunito"), so the kiosk pages don't load it as a
     web font on every page (the Kindle's browser loses letters after many reloads). Remove with unregister.sh. -->
<fontconfig>
    <dir>/mnt/us/extensions/paperkiosk/fonts</dir>
</fontconfig>
